# Updates for the pinned workflow actions and the hash-locked CI tools (REUSE, ruff), weekly, as pull requests that CI checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      ci-tools:
        patterns: ["*"]
